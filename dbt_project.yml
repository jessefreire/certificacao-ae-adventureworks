name: "adventure_works"
version: "1.0.0"
config-version: 2

# O code style da Indicium AI pede que o nome do profile inclua a empresa, para nao colidir
# entre projetos. No dbt Cloud o profile e gerenciado pela interface, mas o campo continua
# existindo e vale manter coerente com a convencao.
profile: "indicium_adventure_works"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  adventure_works:
    # Staging e intermediate como view: o documento `2.5)` do referencial observa que essas
    # camadas geralmente nao precisam ser materializadas, porque armazenamento e mais barato
    # que processamento. View ainda da nome e lineage.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts como table: e o que o Power BI consome, e leitura repetida compensa materializar.
    marts:
      +materialized: table
      +schema: marts

# Uma divergencia declarada: o `dbt_coding_conventions.md` pede `ephemeral` como
# materializacao padrao global. Aqui ela e declarada POR CAMADA, como no banvic-dbt e no
# fluxo `ae-fullflow`. O motivo e o briefing: o video precisa demonstrar o `dbt run`
# criando objetos no Databricks, e modelo `ephemeral` nao cria objeto nenhum — vira CTE.
# Escolha consciente, nao descuido.
